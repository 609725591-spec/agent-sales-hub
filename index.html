document.getElementById('script-steps').innerHTML=steps.map((s,i)=>`<div class="sstep ${i===0?'open':''}" onclick="togStep(this)"><div class="sstep-h"><span class="sn">${i+1}</span><span class="sname">${s.name}</span><span class="stime">${s.time}</span><span class="chev">▾</span></div><div class="sstep-b"><div class="stxt">${fmtS(s.text)}</div><button class="btn btn-out btn-sm" style="margin-top:8px" onclick="event.stopPropagation();navigator.clipboard.writeText(\`${escT(s.text)}\`).then(()=>{this.textContent='已复制 ✓';setTimeout(()=>this.textContent='复制本段',2e3)})">复制本段</button></div></div>`).join('');

function fmtS(t){return t.replace(/\n/g,'<br>').replace(/【([^】]+)】/g,'<strong>【$1】</strong>').replace(/（([^）]+)）/g,'<span style="color:var(--text-light);font-size:12px">（$1）</span>').replace(/"([^"]+)"/g,'<span class="hl">"$1"</span>')}

function renderObj(){document.getElementById('obj-list').innerHTML=OBJ.map(o=>`<div class="oitem" data-q="${o.q}" onclick="this.classList.toggle('exp')"><div class="q">"${o.q}"</div><div class="a">${o.a}</div></div>`).join('')}
function filterObj(kw){const k=kw.toLowerCase();document.querySelectorAll('.oitem').forEach(el=>{const q=el.dataset.q.toLowerCase(),a=el.querySelector('.a').textContent.toLowerCase();el.classList.toggle('hid',k&&!q.includes(k)&&!a.includes(k))})}
function copyScript(){const steps=document.querySelectorAll('.sstep-b .stxt');const titles=['一、开场白','二、挖需求','三、三大卖点','四、前后对比','五、报价','六、异议处理','七、促单金句'];let t='【智能体售卖话术】\n\n';steps.forEach((s,i)=>{t+=titles[i]+'\n'+s.textContent.trim()+'\n\n'});t+='【异议速查】\n';OBJ.forEach(o=>{t+=`Q: "${o.q}"\nA: ${o.a}\n\n`});navigator.clipboard.writeText(t).then(()=>alert('已复制全部话术'))}

// ===== PIPELINE =====
function addDeal(nm,cat,pkg,stage){S.pipeline.push({id:didC++,name:nm,category:cat,pkg,stage,createdAt:Date.now(),followups:[]})}
function dealDays(d){return Math.max(1,Math.ceil((Date.now()-d.createdAt)/864e5))}
function dealCls(d){const dy=dealDays(d);return dy>=7?'dgr':dy>=3?'wrn':''}
function renderPipeline(){document.getElementById('pboard').innerHTML=STG.map(st=>{const deals=S.pipeline.filter(d=>d.stage===st.id);return`<div class="pcol" data-stage="${st.id}" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="dropDeal(event,${st.id});this.classList.remove('dragover')"><div class="pcol-h ${st.cls}">${st.name} <span style="background:rgba(255,255,255,.3);padding:1px 6px;border-radius:8px;margin-left:4px;font-size:10px">${deals.length}</span></div>${deals.map(d=>{const dy=dealDays(d);return`<div class="dcard ${dealCls(d)}" draggable="true" ondragstart="event.dataTransfer.setData('text','${d.id}')" onclick="showDeal(${d.id})"><div class="nm">${d.name}</div><div class="mt">${d.category} · ${PD[d.pkg]?.name||''}</div><div class="dy">${dy}天</div>${d.followups.length?`<div class="fulist">${d.followups.slice(-2).map(f=>`<div class="fuitem">${f.date}: ${f.text}</div>`).join('')}</div>`:''}<div class="na">→ ${st.na}</div></div>`}).join('')}</div>`}).join('')}
function dropDeal(e,st){e.preventDefault();const id=parseInt(e.dataTransfer.getData('text'));const d=S.pipeline.find(x=>x.id===id);if(d){d.stage=st;renderPipeline()}}
function showDeal(id){const d=S.pipeline.find(x=>x.id===id);if(!d)return;const st=STG.find(s=>s.id===d.stage);const mc=document.getElementById('modal-box');
mc.innerHTML=`<div class="modal-ov" onclick="if(event.target===this)this.remove()"><div class="modal"><button class="modal-x" onclick="this.closest('.modal-ov').remove()">×</button><div class="modal-t">${d.name}</div><div style="font-size:13px;color:var(--text-sec);margin-bottom:14px">${d.category} · ${PD[d.pkg]?.name||''} · ${st.name} · ${dealDays(d)}天</div><div class="form-group" style="margin-bottom:14px"><label class="form-label">添加跟进记录</label><div style="display:flex;gap:6px"><input id="fu-in" class="form-input" placeholder="如：商户表示感兴趣"><button class="btn btn-primary btn-sm" onclick="addFU(${d.id})">添加</button></div></div>${d.followups.length?`<div style="margin-bottom:14px"><label class="form-label" style="margin-bottom:6px;display:block">跟进记录</label>${d.followups.map(f=>`<div style="padding:6px 10px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:3px;font-size:12px"><span style="color:var(--text-light)">${f.date}</span> ${f.text}</div>`).join('')}</div>`:''}<div class="btn-group"><button class="btn btn-sec btn-sm" onclick="dealToSum(${d.id})">标记签约 → 售卖总结</button>${d.stage<5?`<button class="btn btn-out btn-sm" onclick="advDeal(${d.id})">推进到下一阶段</button>`:''}</div></div></div>`}
function addFU(id){const inp=document.getElementById('fu-in');if(!inp.value.trim())return;const d=S.pipeline.find(x=>x.id===id);d.followups.push({date:new Date().toLocaleDateString('zh-CN',{month:'short',day:'numeric'}),text:inp.value.trim()});showDeal(id);renderPipeline()}
function advDeal(id){const d=S.pipeline.find(x=>x.id===id);if(d&&d.stage<5){d.stage++;renderPipeline();document.querySelector('.modal-ov')?.remove()}}
function dealToSum(id){const d=S.pipeline.find(x=>x.id===id);if(!d)return;S.summaries.push({...d,signedAt:Date.now(),dealReason:[],objection:[],summaryText:''});S.pipeline=S.pipeline.filter(x=>x.id!==id);document.querySelector('.modal-ov')?.remove();renderPipeline();switchTab('summary')}
function showAddDeal(){const mc=document.getElementById('modal-box');mc.innerHTML=`<div class="modal-ov" onclick="if(event.target===this)this.remove()"><div class="modal"><button class="modal-x" onclick="this.closest('.modal-ov').remove()">×</button><div class="modal-t">添加客户</div><div class="form-grid" style="grid-template-columns:1fr;margin-bottom:14px"><div class="form-group"><label class="form-label">商户名称</label><input id="ad-nm" class="form-input" placeholder="如：老王火锅5店"></div><div class="form-group"><label class="form-label">品类</label><select id="ad-cat" class="form-select"><option>中餐</option><option>火锅</option><option>烧烤</option><option>茶饮</option><option>西餐</option><option>快餐</option><option>小吃</option><option>其他</option></select></div><div class="form-group"><label class="form-label">推荐售卖包</label><select id="ad-pkg" class="form-select"><option value="starter">入门包</option><option value="growth">增长包</option><option value="flagship">旗舰包</option></select></div></div><div class="btn-group"><button class="btn btn-primary" onclick="confirmAdd()">添加</button></div></div></div>`}
function confirmAdd(){const n=document.getElementById('ad-nm').value;if(!n){alert('请输入商户名称');return}addDeal(n,document.getElementById('ad-cat').value,document.getElementById('ad-pkg').value,1);document.querySelector('.modal-ov')?.remove();renderPipeline()}

// ===== SUMMARY =====
function renderSummary(){const sums=S.summaries;const total=sums.length;const reasons={};sums.forEach(s=>s.dealReason.forEach(r=>reasons[r]=(reasons[r]||0)+1));const topR=Object.keys(reasons).length?Object.entries(reasons).sort((a,b)=>b[1]-a[1])[0][0]:'-';
document.getElementById('sum-stats').innerHTML=`<div class="stcard"><div class="sn">${total}</div><div class="sl">成交总数</div></div><div class="stcard"><div class="sn">${topR}</div><div class="sl">最常成交原因</div></div><div class="stcard"><div class="sn">${sums.filter(s=>s.pkg==='starter').length}/${sums.filter(s=>s.pkg==='growth').length}/${sums.filter(s=>s.pkg==='flagship').length}</div><div class="sl">入门/增长/旗舰</div></div><div class="stcard"><div class="sn">${total?Math.round(sums.reduce((a,s)=>a+dealDays(s),0)/total):'-'}天</div><div class="sl">平均跟进天数</div></div>`;
document.getElementById('sum-list').innerHTML=total?sums.map((s,i)=>`<div class="sitem"><span class="tg ${PD[s.pkg]?.b||''}">${PD[s.pkg]?.name||s.pkg}</span><div style="flex:1"><div style="font-weight:700;font-size:13px">${s.name}</div><div style="font-size:11px;color:var(--text-sec)">${s.category} · ${dealDays(s)}天 · ${s.dealReason.length?s.dealReason.join('/'):'未填原因'}</div></div><div class="btn-group" style="margin:0"><button class="btn btn-out btn-xs" onclick="editSum(${i})">编辑</button><button class="btn btn-out btn-xs" onclick="sumToCase(${i})">生成案例</button></div></div>`).join(''):'<div class="empty"><div class="ei">📊</div><p>暂无成交记录。Pipeline中推进至签约后自动归档。</p></div>'}
function editSum(i){const s=S.summaries[i];const mc=document.getElementById('modal-box');mc.innerHTML=`<div class="modal-ov" onclick="if(event.target===this)this.remove()"><div class="modal"><button class="modal-x" onclick="this.closest('.modal-ov').remove()">×</button><div class="modal-t">编辑售卖总结 · ${s.name}</div><div class="form-group" style="margin-bottom:10px"><label class="form-label">成交原因（多选）</label><div class="cg" id="s-rsn">${['产品打动','价格合适','同行在用','关系到位','其他'].map(r=>`<div class="co ${s.dealReason.includes(r)?'on':''}" onclick="this.classList.toggle('on')">${r}</div>`).join('')}</div></div><div class="form-group" style="margin-bottom:10px"><label class="form-label">主要异议点（多选）</label><div class="cg" id="s-obj">${['太贵','不需要','竞品','效果质疑','其他'].map(o=>`<div class="co ${s.objection.includes(o)?'on':''}" onclick="this.classList.toggle('on')">${o}</div>`).join('')}</div></div><div class="form-group" style="margin-bottom:10px"><label class="form-label">一句话总结</label><input id="s-txt" class="form-input" value="${s.summaryText||''}" placeholder="如：客户对AI接待印象深刻"></div><div class="btn-group"><button class="btn btn-primary" onclick="saveSum(${i})">保存</button></div></div></div>`}
function saveSum(i){const s=S.summaries[i];s.dealReason=[...document.querySelectorAll('#s-rsn .co.on')].map(el=>el.textContent);s.objection=[...document.querySelectorAll('#s-obj .co.on')].map(el=>el.textContent);s.summaryText=document.getElementById('s-txt').value;document.querySelector('.modal-ov')?.remove();renderSummary()}
function sumToCase(i){switchTab('casegen');const s=S.summaries[i];document.getElementById('c-cat').value=s.category;document.getElementById('c-pkg').value=s.pkg;updCase()}

// ===== EXAM =====
function renderExam(){const el=document.getElementById('exam-area');
if(!S.examQs&&!S.examDone){el.innerHTML=`<div style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:16px">🎓</div><h3 style="margin-bottom:8px">品牌智能体产品认证考试</h3><p style="color:var(--text-sec);font-size:13px;margin-bottom:8px">共20题，每题5分，80分及格</p><p style="color:var(--text-sec);font-size:12px;margin-bottom:20px">题型：单选题 · 限时：无 · 交卷后即时出分</p>${S.examPassed?'<div class="exam-badge" style="margin-bottom:16px">已通过认证 🎉</div>':''}<button class="btn btn-primary" onclick="startExam()">开始考试</button></div>`;return}
if(S.examDone){showExamResult();return}
renderExamQ()}
function startExam(){const shuffled=[...EQ].sort(()=>Math.random()-.5);S.examQs=shuffled.slice(0,20);S.examIdx=0;S.examCorrect=0;S.examAnswers=[];S.examDone=false;renderExamQ()}
function renderExamQ(){const q=S.examQs[S.examIdx];const el=document.getElementById('exam-area');
const dots=S.examQs.map((_,i)=>{let cls='exam-dot';if(i===S.examIdx)cls+=' cur';else if(S.examAnswers[i]!==undefined)cls+=S.examAnswers[i]?' right':' wrong';return`<div class="${cls}"></div>`}).join('');
el.innerHTML=`<div class="exam-progress">${dots}</div><div style="font-size:12px;color:var(--text-sec);margin-bottom:12px">第${S.examIdx+1}/20题</div><div class="exam-q">${q.q}</div><div class="exam-opts" id="exam-opts">${q.opts.map((o,i)=>`<div class="exam-opt" data-i="${i}" onclick="selExamOpt(this)">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div><div class="btn-group"><button class="btn btn-primary" id="exam-next" onclick="nextExamQ()" disabled>下一题</button></div>`}
function selExamOpt(el){document.querySelectorAll('.exam-opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');document.getElementById('exam-next').disabled=false}
function nextExamQ(){const sel=document.querySelector('.exam-opt.sel');if(!sel)return;const idx=parseInt(sel.dataset.i);const correct=idx===S.examQs[S.examIdx].ans;S.examAnswers[S.examIdx]=correct;if(correct)S.examCorrect++;
// Show feedback
document.querySelectorAll('.exam-opt').forEach(o=>{const i=parseInt(o.dataset.i);if(i===S.examQs[S.examIdx].ans)o.classList.add('correct');else if(i===idx&&!correct)o.classList.add('wrong');o.classList.add('disabled')});
const btn=document.getElementById('exam-next');
if(S.examIdx>=19){btn.textContent='查看成绩';btn.onclick=()=>{S.examDone=true;showExamResult()}}else{setTimeout(()=>{S.examIdx++;renderExamQ()},800)}}
function showExamResult(){const score=S.examCorrect*5;const pass=score>=80;if(pass)S.examPassed=true;
document.getElementById('exam-area').innerHTML=`<div class="exam-result"><div style="font-size:48px;margin-bottom:16px">${pass?'🎉':'😢'}</div><div class="exam-score">${score}</div><div style="font-size:14px;color:var(--text-sec);margin-top:8px">${S.examCorrect}/20 正确 · ${pass?'恭喜通过！':'未达80分及格线'}</div>${pass?'<div class="exam-badge">产品认证通过 🏅</div>':''}<div class="btn-group" style="justify-content:center;margin-top:20px"><button class="btn btn-primary" onclick="S.examQs=null;S.examDone=false;renderExam()">重新考试</button></div></div>`}

// ===== PRACTICE =====
function renderPractice(){const el=document.getElementById('practice-area');
if(S.rpDone){const pct=Math.round(S.rpScore/S.rpTotal*100);el.innerHTML=`<div class="exam-result"><div style="font-size:48px;margin-bottom:16px">${pct>=80?'🌟':pct>=60?'👍':'💪'}</div><div class="exam-score">${pct}分</div><div style="font-size:14px;color:var(--text-sec);margin-top:8px">${RP[S.rpScene].name} · 得分${S.rpScore}/${S.rpTotal}</div><div style="margin-top:12px"><div class="rp-score-bar" style="max-width:300px;margin:0 auto"><div class="rp-score-fill" style="width:${pct}%;background:${pct>=80?'var(--success)':pct>=60?'var(--warning)':'var(--danger)'}"></div></div></div><div class="btn-group" style="justify-content:center;margin-top:20px"><button class="btn btn-primary" onclick="S.rpDone=false;S.rpScene=0;renderPractice()">换一个场景</button><button class="btn btn-sec" onclick="S.rpDone=false;S.rpScene=(S.rpScene+1)%${RP.length};renderPractice()">下一个场景</button></div></div>`;return}
if(!S.rpRound&&S.rpRound!==0){el.innerHTML=`<div style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:16px">🎭</div><h3 style="margin-bottom:16px">选择一个对练场景</h3><div style="display:flex;flex-direction:column;gap:10px;max-width:400px;margin:0 auto">${RP.map((s,i)=>`<button class="btn btn-out" style="justify-content:flex-start;padding:14px 20px" onclick="startRP(${i})"><span style="font-size:20px;margin-right:8px">🎬</span><div style="text-align:left"><div style="font-weight:700">${s.name}</div><div style="font-size:11px;color:var(--text-sec)">${s.desc}</div></div></button>`).join('')}</div></div>`;return}
renderRPRound()}
function startRP(i){S.rpScene=i;S.rpRound=0;S.rpScore=0;S.rpTotal=0;S.rpDone=false;renderRPRound()}
function renderRPRound(){const scene=RP[S.rpScene];const round=scene.rounds[S.rpRound];const el=document.getElementById('practice-area');
const prog=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><span class="ptag" style="background:var(--primary-bg);color:var(--primary)">${scene.name}</span><span style="font-size:12px;color:var(--text-sec)">第${S.rpRound+1}/${scene.rounds.length}轮</span><div style="flex:1"><div class="rp-score-bar"><div class="rp-score-fill" style="width:${S.rpTotal?Math.round(S.rpScore/S.rpTotal*100):0}%;background:var(--success)"></div></div></div></div>`;
el.innerHTML=`<div class="rp-scene">${prog}<div class="rp-msg rp-merchant"><strong>🧑 商户：</strong>${round.merchant}</div><div style="font-size:12px;color:var(--text-sec);margin:12px 0 8px">选择你的回应：</div><div class="rp-opts" id="rp-opts">${round.opts.map((o,i)=>`<div class="rp-opt" data-i="${i}" onclick="selRP(this,${i})">${o.text}</div>`).join('')}</div><div id="rp-fb"></div></div>`}
function selRP(el,idx){const round=RP[S.rpScene].rounds[S.rpRound];const opt=round.opts[idx];S.rpScore+=opt.score;S.rpTotal+=10;
document.querySelectorAll('.rp-opt').forEach(o=>{const i=parseInt(o.dataset.i);o.classList.add('disabled');const score=round.opts[i].score;if(score>=8)o.classList.add('best');else if(score>=3)o.classList.add('ok');else o.classList.add('bad')});
document.getElementById('rp-fb').innerHTML=`<div class="rp-feedback"><strong>${opt.score>=8?'✅ 最佳回应！':opt.score>=3?'⚠️ 可以更好':'❌ 不推荐'}</strong><br>${opt.fb}</div><div class="btn-group"><button class="btn btn-primary btn-sm" onclick="nextRPRound()">${S.rpRound>=RP[S.rpScene].rounds.length-1?'查看成绩':'下一轮 →'}</button></div>`}
function nextRPRound(){if(S.rpRound>=RP[S.rpScene].rounds.length-1){S.rpDone=true;renderPractice()}else{S.rpRound++;renderRPRound()}}

// ===== DASHBOARD =====
function renderDash(){const total=DASH.reduce((a,r)=>a+r.deals,0);const totalAmt=DASH.reduce((a,r)=>a+r.amount,0);const avgCombo=Math.round(DASH.reduce((a,r)=>a+r.comboRate,0)/DASH.length);const avgArpu=Math.round(DASH.reduce((a,r)=>a+r.arpu,0)/DASH.length);
document.getElementById('dash-stats').innerHTML=`<div class="ds-card"><div class="dv">${total}</div><div class="dl">总签约单数</div><div class="dc up">↑12%</div></div><div class="ds-card"><div class="dv">¥${(totalAmt/10000).toFixed(0)}万</div><div class="dl">总签约金额</div><div class="dc up">↑8%</div></div><div class="ds-card"><div class="dv">${avgCombo}%</div><div class="dl">平均组合购渗透率</div><div class="dc ${avgCombo>=15?'up':'down'}">${avgCombo>=15?'↑':'↓'}目标20%</div></div><div class="ds-card"><div class="dv">¥${avgArpu}</div><div class="dl">平均ARPU</div><div class="dc up">↑5%</div></div><div class="ds-card"><div class="dv">${DASH.length}</div><div class="dl">大区数</div></div>`;
document.getElementById('dash-rank').innerHTML=`<table class="rank-table"><thead><tr><th>排名</th><th>大区</th><th>单数</th><th>金额</th><th>渗透率</th><th>ARPU</th></tr></thead><tbody>${[...DASH].sort((a,b)=>b.amount-a.amount).map((r,i)=>`<tr><td>${i+1}</td><td><strong>${r.name}</strong></td><td>${r.deals}</td><td>¥${(r.amount/10000).toFixed(1)}万</td><td class="${r.comboRate>=15?'good-cell':r.comboRate<10?'warn-cell':''}">${r.comboRate}%</td><td>¥${r.arpu}</td></tr>`).join('')}</tbody></table>`;
document.getElementById('dash-combo').innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">${DASH.map(r=>`<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>${r.name}</span><span class="${r.comboRate>=15?'':'warn-cell'}">${r.comboRate}%</span></div><div class="rp-score-bar"><div class="rp-score-fill" style="width:${r.comboRate*2}%;background:${r.comboRate>=20?'var(--success)':r.comboRate>=10?'var(--warning)':'var(--danger)'}"></div></div></div>`).join('')}</div><div style="margin-top:16px;padding:10px 14px;background:var(--bg);border-radius:var(--radius-sm);font-size:12px;color:var(--text-sec)"><strong>洞察：</strong>华西组合购渗透率45%远超其他大区，华东仅5%需重点提升。获客宝占比从67%降至54%，效果广告占比升至31%。</div>`}

// ===== GALLERY =====
let galleryFilter='all';
function renderGallery(){const filters=['all','中餐','火锅','烧烤','茶饮','海鲜','西餐','快餐'];
document.getElementById('gallery-filters').innerHTML=filters.map(f=>`<div class="gf-opt ${galleryFilter===f?'on':''}" onclick="galleryFilter='${f}';renderGallery()">${f==='all'?'全部':f}</div>`).join('');
const cases=galleryFilter==='all'?DEMO_CASES:DEMO_CASES.filter(c=>c.cat===galleryFilter);
document.getElementById('gallery-grid').innerHTML=cases.map(c=>{const theme=TH[c.cat]||TH['中餐'];const pi=PD[c.pkg];return`<div class="gallery-item" onclick="viewCase('${c.cat}','${c.pkg}')"><div style="padding:20px;background:linear-gradient(180deg,${theme.bg},#030712);text-align:center"><div style="font-size:28px;font-weight:900;color:${theme.ac}">${c.headline}</div><div style="font-size:12px;opacity:.7">${c.sub}</div><div style="font-size:11px;opacity:.5;margin-top:4px">${theme.em} 某${c.cat}门店</div></div><div class="gallery-meta"><span class="gallery-tag ${pi.b}">${pi.name}</span><div class="gallery-info">${c.pain}</div></div></div>`}).join('')||'<div class="empty"><div class="ei">🏛️</div><p>暂无该品类案例</p></div>'}
function viewCase(cat,pkg){switchTab('casegen');document.getElementById('c-cat').value=cat;document.getElementById('c-pkg').value=pkg;const dc=DEMO_CASES.find(c=>c.cat===cat&&c.pkg===pkg);if(dc){document.getElementById('c-m1v').value=dc.headline;document.getElementById('c-m1d').value=dc.sub;document.getElementById('c-pain').value=dc.pain;document.getElementById('c-slogan').value=dc.slogan;document.getElementById('c-strat').value=dc.strat}updCase()}

// ===== INIT =====
renderObj();updCase();
addDeal('老王火锅·8店','火锅','growth',2);addDeal('鲜茶道·3店','茶饮','starter',1);addDeal('川味坊·5店','中餐','starter',3);
S.pipeline[0].followups=[{date:'6月10日',text:'首次拜访，老板对AI接待感兴趣'},{date:'6月11日',text:'发送方案，等待回复'}];
</script>
